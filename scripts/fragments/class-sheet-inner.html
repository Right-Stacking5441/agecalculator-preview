<div class="sheet" data-sheet>
<div class="sheet-top"><label>Test date <input type="text" id="sheet-date" placeholder="e.g. 16 November 2026"></label><label>Group or class <input type="text" id="sheet-group" placeholder="e.g. Year 3, Oak class"></label></div>
<table class="sheet-table"><thead><tr><th scope="col">Name</th><th scope="col">Date of birth</th><th scope="col">Age (y;m;d)</th><th scope="col">Months</th></tr></thead><tbody id="sheet-rows"></tbody></table>
<div class="sheet-actions"><button type="button" class="btn btn-quiet" id="sheet-add">Add a row</button><button type="button" class="btn" id="sheet-print">Print the sheet</button></div>
<p class="sheet-foot">Ages worked out at agecalculator.com/chronological-age. A 29 February birthday counts on 1 March in common years. Check your test manual’s rounding rule.</p>
</div>

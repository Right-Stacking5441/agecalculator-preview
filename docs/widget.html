<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Age calculator widget</title>
<meta name="description" content="Embeddable age calculator from agecalculator.com.">
<link rel="canonical" href="https://agecalculator.com/widget">
<meta name="robots" content="noindex,nofollow">
<meta property="og:title" content="Age calculator widget">
<meta property="og:description" content="Embeddable age calculator from agecalculator.com.">
<meta property="og:url" content="https://agecalculator.com/widget">
<meta property="og:type" content="website">
<meta name="theme-color" content="#f1f1ec">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<base target="_blank">
<link rel="preload" href="fonts/libre-franklin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body class="widget">
<div class="preview-banner">Preview, not live. This is a working mock-up of a new agecalculator.com. It is not the live site, and it should not be indexed.</div>
<div class="calc" data-calc data-tool="age">
<form class="entry" novalidate>
<p class="w-title">Age calculator</p>
<div class="datefield " data-datefield="dob">
<label class="df-label" for="dob-q">Date of birth</label>
<input id="dob-q" class="quick" type="text" spellcheck="false" autocomplete="bday" placeholder="e.g. 15 March 1995" aria-describedby="dob-read">
<div class="parts" role="group" aria-label="Date of birth: day, month and year">
<label><span>Day</span><input class="p-d" type="text" inputmode="numeric" maxlength="2" placeholder="DD" autocomplete="bday-day"></label>
<label><span>Month</span><input class="p-m" type="text" inputmode="numeric" maxlength="2" placeholder="MM" autocomplete="bday-month"></label>
<label><span>Year</span><input class="p-y" type="text" inputmode="numeric" maxlength="4" placeholder="YYYY" autocomplete="bday-year"></label>
</div>
<p class="readback" id="dob-read"></p>
</div>
<div class="on">
<p>As of <span id="on-label">today, <b>16 November 2026</b></span> <button type="button" class="textbtn" id="on-toggle" aria-expanded="false" aria-controls="on-box">Change</button></p>
<div id="on-box" hidden>
<div class="datefield df-small" data-datefield="on">
<label class="df-label" for="on-q">Age on this date</label>
<input id="on-q" class="quick" type="text" spellcheck="false" autocomplete="off" placeholder="e.g. 1 January 2030" aria-describedby="on-read">
<div class="parts" role="group" aria-label="Age on this date: day, month and year">
<label><span>Day</span><input class="p-d" type="text" inputmode="numeric" maxlength="2" placeholder="DD"></label>
<label><span>Month</span><input class="p-m" type="text" inputmode="numeric" maxlength="2" placeholder="MM"></label>
<label><span>Year</span><input class="p-y" type="text" inputmode="numeric" maxlength="4" placeholder="YYYY"></label>
</div>
<p class="readback" id="on-read"></p>
</div>
<label class="zone-pick">Time zone for “today” <select id="zone"><option>Europe/London</option></select></label>
</div>
</div>
</form>
<div class="result"><div class="leaf" id="leaf" data-state="empty"><div class="leaf-head"><span>Today</span></div>
<div class="leaf-body"><div class="lead"><p class="big"><span class="num">16</span><span class="unit">November</span></p>
<p class="rest">Type a date of birth to see your age in years, months and days.</p></div></div>
<noscript><p class="hint">This calculator needs JavaScript to work out the result. You can use it at agecalculator.com.</p></noscript></div><p class="sr-only" id="live" aria-live="polite"></p></div>
</div>
<p class="credit"><a href="https://agecalculator.com/">Age calculator by agecalculator.com</a></p>
<script src="dates.js" defer></script><script src="app.js" defer></script>
</body></html>

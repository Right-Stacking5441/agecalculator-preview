<meta content="Age calculator widget" property="og:title"/>
<meta content="Embeddable age calculator from agecalculator.com." property="og:description"/>
<meta content="https://agecalculator.com/widget/" property="og:url"/>
<meta content="website" property="og:type"/>
<meta content="#f1f1ec" name="theme-color"/>

<link href="../favicon.svg" rel="icon" type="image/svg+xml"/>

<script>var q=location.search;if(/[?&](dob|a|b|start|end|test|on|year)=/.test(q))document.documentElement.classList.add('prefill');if(/[?&]year=/.test(q))document.documentElement.classList.add('prefill-year');if(/[?&](on|year)=/.test(q))document.documentElement.classList.add('prefill-on')</script>
<link href="../ux.css?v=f59e6c9fd0" rel="stylesheet"/><noscript><style>.on-date, .on.settings button, .on.settings .tzline, .parts-toggle, .parts-shared, #leaf .ph-msg, #on-label[data-idle], .on.settings:has(#on-label[data-idle]) { display: none !important; }</style></noscript></head>
<body class="widget">
<main>
<h1 class="sr-only">Age calculator</h1>
<div class="calc" data-calc="" data-tool="age">
<form class="entry" novalidate="">
<p class="w-title">Age calculator</p>
<div class="datefield" data-datefield="dob">
<label class="df-label" for="dob-q">Date of birth</label>
<input aria-describedby="dob-read" autocomplete="bday" class="quick" id="dob-q" placeholder="e.g. 15 March 1995" spellcheck="false" type="text"/>
<div class="df-foot"><p class="readback" id="dob-read"></p><button aria-controls="dob-parts" aria-expanded="false" class="textbtn parts-toggle" type="button"><svg aria-hidden="true" class="ic ic-boxes" focusable="false" height="20" viewbox="0 0 24 24" width="20"><path d="M3.4 8.9l4.7.1v6.1H3.5zM10 9h4.3l.1 6h-4.4zM16.4 8.9h4.2v6.2h-4.2z"></path></svg><span>Type day, month and year separately</span></button></div><div aria-label="Date of birth: day, month and year" class="parts" hidden="" id="dob-parts" role="group">
<label><span>Day</span><input autocomplete="bday-day" class="p-d" inputmode="numeric" maxlength="2" placeholder="DD" type="text"/></label>
<label><span>Month</span><input autocomplete="bday-month" class="p-m" inputmode="numeric" maxlength="2" placeholder="MM" type="text"/></label>
<label><span>Year</span><input autocomplete="bday-year" class="p-y" inputmode="numeric" maxlength="4" placeholder="YYYY" type="text"/></label>
</div>
</div>
</form>
<div class="result"><div class="leaf" data-state="empty" id="leaf"><div class="leaf-body"><div class="lead"><p class="ph-msg">Your age will appear here.</p></div></div><noscript><p class="hint">This calculator needs JavaScript to work out the result. You can use it at agecalculator.com.</p></noscript></div><p aria-live="polite" class="sr-only" id="live"></p><div class="on settings">
<p><svg aria-hidden="true" class="ic ic-clock" focusable="false" height="20" viewbox="0 0 24 24" width="20"><path d="M12 3.4c4.9-.1 8.6 3.7 8.6 8.5 0 4.8-3.8 8.7-8.7 8.6-4.7-.1-8.4-3.9-8.3-8.7.1-4.6 3.6-8.3 8.6-8.5.6 0 1.2.1 1.7.2M12 7.4v4.8l3.1 2.1"></path></svg><span id="on-label">Age today<span class="on-date">, <b>Tue 17 Nov 2026</b></span></span><script>
(function(){
  var el=document.getElementById('on-label');
  if(!el || el.hidden || el.getAttribute('data-idle')) return;
  var M=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var W=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var n=new Date(), mon=M[n.getMonth()].slice(0,3);
  var dspan=el.querySelector('.on-date');
  if(!dspan){ dspan=document.createElement('span'); dspan.className='on-date'; el.appendChild(dspan); }
  dspan.innerHTML=', <b>'+W[n.getDay()].slice(0,3)+' '+n.getDate()+' '+mon+' '+n.getFullYear()+'</b>';
})();
</script></p>
<div hidden="" id="on-box">
<div class="datefield df-small" data-datefield="on">
<label class="df-label" for="on-q">Age on this date</label>
<input aria-describedby="on-read" autocomplete="off" class="quick" id="on-q" placeholder="e.g. 1 January 2030" spellcheck="false" type="text"/>
<div class="df-foot"><p class="readback" id="on-read"></p></div><div aria-label="Age on this date: day, month and year" class="parts" hidden="" id="on-parts" role="group">
<label><span>Day</span><input class="p-d" inputmode="numeric" maxlength="2" placeholder="DD" type="text"/></label>
<label><span>Month</span><input class="p-m" inputmode="numeric" maxlength="2" placeholder="MM" type="text"/></label>
<label><span>Year</span><input class="p-y" inputmode="numeric" maxlength="4" placeholder="YYYY" type="text"/></label>
</div>
</div>
<label class="zone-pick">Time zone for “today” <select id="zone"><option>Europe/London</option></select></label>
</div>
</div></div>
</div>
<p class="credit"><a href="https://agecalculator.com/">Age calculator by agecalculator.com</a></p>
</main>
<script defer="" src="../dates.js?v=b4e78af13e"></script><script defer="" src="../app.js?v=53f820a449"></script>
<script>
(function(){
  var menu = document.querySelector('details.nav-menu');
  if (!menu) return;
  var summary = menu.querySelector('summary');
  if (!summary) return;
  var list = menu.querySelector('ul');
  if (list && !list.id) list.id = 'nav-menu-list';
  if (list) summary.setAttribute('aria-controls', list.id);

  function sync() {
    summary.setAttribute('aria-expanded', menu.open ? 'true' : 'false');
  }
  function setOpen(open) {
    menu.open = !!open;
    sync();
  }
  menu.addEventListener('toggle', sync);
  sync();

  /* Remember the open state when the press starts. On iOS Safari the native
     details toggle often runs before click, so preventDefault on click is
     too late; if the state already changed, do not flip it back. This
     listener does not toggle. */
  var openAtDown = false;
  var closedByOutside = false;
  summary.addEventListener('pointerdown', function () {
    openAtDown = menu.open;
    closedByOutside = false;
  });

  /* One click handler on the button only. */
  summary.addEventListener('click', function (e) {
    e.preventDefault();
    e.stopPropagation();
    if (closedByOutside) { closedByOutside = false; return; }
    if (e.detail !== 0 && menu.open !== openAtDown) { sync(); return; }
    setOpen(!menu.open);
  });

  function insideMenu(el) {
    return !!(el && (el === menu || menu.contains(el) || el === summary || summary.contains(el)));
  }
  /* Outside: pointerdown on document. Do not also listen for click, or a
     mis-targeted close can be followed by the button click reopening it. */
  document.addEventListener('pointerdown', function (e) {
    if (!menu.open) return;
    if (insideMenu(e.target)) return;
    setOpen(false);
    closedByOutside = true;
  }, true);

  function closeIfLink(e) {
    var a = e.target && e.target.closest ? e.target.closest('a') : null;
    if (a && menu.contains(a)) setOpen(false);
  }
  menu.addEventListener('click', closeIfLink);

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' && e.key !== 'Esc') return;
    if (!menu.open) return;
    setOpen(false);
    summary.focus({ preventScroll: true });
  });

  window.addEventListener('pageshow', function (e) {
    if (e.persisted) setOpen(false);
  });
  window.addEventListener('popstate', function () { setOpen(false); });
})();

(function(){
  function openHash() {
    var id = (location.hash || '').replace(/^#/, '');
    if (!id) return;
    var el = document.getElementById(id);
    if (!el) return;
    var d = (el.matches && el.matches('details')) ? el : (el.closest ? el.closest('details') : null);
    if (d) d.open = true;
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', openHash);
  else openHash();
  window.addEventListener('hashchange', openHash);
})();
</script></body>
</html>
